[project]
name = "garmin-training-export"
version = "0.1.0"
description = "Export Garmin Connect training data to CSV, incrementally."
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "garminconnect>=0.3.9",
]

[tool.uv]
package = false    # scripts, not an installable package

[tool.ruff.lint]
# Broad `except Exception` is deliberate: failures are classified by is_transient() or
# recorded per activity/endpoint/domain instead of aborting the run.
ignore = ["BLE001"]
